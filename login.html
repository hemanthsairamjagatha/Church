<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Portal Login | Mizpah Ministries</title>
  <link rel="icon" type="image/svg+xml"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%231E5AA8'><path d='M11 2h2v7h7v2h-7v11h-2V11H4V9h7V2z'/></svg>">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet">

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    :root {
      --primary-navy: #0B192C;
      --navy-card: #152238;
      --navy-light: #1E3E62;
      --royal-blue: #1E5AA8;
      --accent-gold: #D4AF37;
      --accent-gold-hover: #BF9B30;
      --text-dark: #1F2937;
      --text-muted: #6B7280;
      --bg-slate: #0b1320;
      --border-color: rgba(255, 255, 255, 0.12);
      --font-body: 'Plus Jakarta Sans', sans-serif;
      --font-heading: 'Cinzel', serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-body);
      background: radial-gradient(circle at top center, #1b3152 0%, #080f1a 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      color: #FFFFFF;
      position: relative;
      overflow-x: hidden;
    }

    /* Ambient backdrop glow */
    body::before {
      content: '';
      position: absolute;
      top: -20%;
      left: 50%;
      transform: translateX(-50%);
      width: 650px;
      height: 650px;
      background: radial-gradient(circle, rgba(30, 90, 168, 0.25) 0%, transparent 70%);
      filter: blur(80px);
      z-index: 0;
      pointer-events: none;
    }

    .login-container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 440px;
    }

    .login-card {
      background: rgba(21, 34, 56, 0.85);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 40px 36px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.05);
    }

    .brand-header {
      text-align: center;
      margin-bottom: 32px;
    }

    .logo-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 64px;
      height: 64px;
      border-radius: 18px;
      background: linear-gradient(135deg, rgba(30, 90, 168, 0.4), rgba(212, 175, 55, 0.15));
      border: 1px solid rgba(212, 175, 55, 0.35);
      margin-bottom: 18px;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
    }

    .cross-svg {
      width: 32px;
      height: 32px;
    }

    .portal-title {
      font-family: var(--font-heading);
      font-size: 24px;
      letter-spacing: 0.5px;
      color: #FFFFFF;
      margin-bottom: 6px;
    }

    .portal-subtitle {
      font-size: 14px;
      color: #9CA3AF;
      line-height: 1.5;
    }

    .form-group {
      margin-bottom: 22px;
    }

    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #E5E7EB;
      margin-bottom: 8px;
      letter-spacing: 0.3px;
    }

    .input-wrapper {
      position: relative;
    }

    .input-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: #9CA3AF;
      font-size: 15px;
      pointer-events: none;
    }

    .form-control {
      width: 100%;
      height: 48px;
      background: rgba(11, 25, 44, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 10px;
      padding: 0 16px 0 42px;
      font-size: 14px;
      color: #FFFFFF;
      font-family: var(--font-body);
      transition: all 0.25s ease;
    }

    .form-control:focus {
      outline: none;
      border-color: var(--royal-blue);
      box-shadow: 0 0 0 3px rgba(30, 90, 168, 0.3);
      background: rgba(11, 25, 44, 0.95);
    }

    .toggle-pwd {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: #9CA3AF;
      cursor: pointer;
      font-size: 14px;
      padding: 4px;
    }

    .toggle-pwd:hover {
      color: #FFFFFF;
    }

    .submit-btn {
      width: 100%;
      height: 48px;
      background: linear-gradient(135deg, #1E5AA8 0%, #154280 100%);
      color: #FFFFFF;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 10px;
      font-family: var(--font-body);
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.25s ease;
      box-shadow: 0 4px 14px rgba(30, 90, 168, 0.4);
      margin-top: 10px;
    }

    .submit-btn:hover {
      background: linear-gradient(135deg, #256bca 0%, #1a4d94 100%);
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(30, 90, 168, 0.55);
    }

    .submit-btn:disabled {
      opacity: 0.65;
      cursor: not-allowed;
      transform: none;
    }

    .alert-box {
      display: none;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 13.5px;
      margin-bottom: 20px;
      line-height: 1.4;
    }

    .alert-box.visible {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .alert-error {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.35);
      color: #FCA5A5;
    }

    .alert-success {
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.35);
      color: #6EE7B7;
    }

    .credentials-hint {
      margin-top: 24px;
      padding: 14px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px dashed rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      font-size: 12.5px;
      color: #9CA3AF;
    }

    .credentials-hint strong {
      color: #E5E7EB;
      display: block;
      margin-bottom: 4px;
      font-size: 12.5px;
    }

    .credentials-hint code {
      color: var(--accent-gold);
      background: rgba(0, 0, 0, 0.3);
      padding: 2px 6px;
      border-radius: 4px;
      font-family: monospace;
      font-size: 12px;
    }

    .back-link {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 24px;
      color: #9CA3AF;
      text-decoration: none;
      font-size: 13.5px;
      transition: color 0.2s ease;
    }

    .back-link:hover {
      color: #FFFFFF;
    }

    @media (max-width: 480px) {
      body {
        padding: 16px 12px;
      }
      .login-card {
        padding: 28px 18px;
        border-radius: 16px;
      }
      .brand-header {
        margin-bottom: 22px;
      }
      .logo-badge {
        width: 52px;
        height: 52px;
        border-radius: 14px;
        margin-bottom: 12px;
      }
      .cross-svg {
        width: 26px;
        height: 26px;
      }
      .portal-title {
        font-size: 20px;
      }
      .portal-subtitle {
        font-size: 13px;
      }
      .form-group {
        margin-bottom: 16px;
      }
      .form-control {
        height: 44px;
        font-size: 13.5px;
      }
      .submit-btn {
        height: 46px;
        font-size: 14px;
      }
      .credentials-hint {
        padding: 12px;
        font-size: 12px;
      }
    }
  </style>
</head>

<body>

  <div class="login-container">
    <div class="login-card">

      <div class="brand-header">
        <div class="logo-badge">
          <svg viewBox="0 0 36 36" class="cross-svg" aria-hidden="true">
            <path d="M17 5h2v9h8v2h-8v15h-2V16H9v-2h8V5z" fill="#D4AF37" />
          </svg>
        </div>
        <h1 class="portal-title">Mizpah Ministries</h1>
        <p class="portal-subtitle">Church Administration Portal</p>
      </div>

      <!-- Alert Box -->
      <div id="alertBox" class="alert-box" role="alert">
        <i class="fa-solid fa-circle-exclamation alert-icon"></i>
        <span id="alertMessage">Invalid email or password.</span>
      </div>

      <form id="loginForm">
        <div class="form-group">
          <label class="form-label" for="adminEmail">Email Address</label>
          <div class="input-wrapper">
            <i class="fa-regular fa-envelope input-icon"></i>
            <input type="email" id="adminEmail" class="form-control" placeholder="admin@mizpahministries.org"
              value="admin@mizpahministries.org" required autofocus>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="adminPassword">Password</label>
          <div class="input-wrapper">
            <i class="fa-solid fa-lock input-icon"></i>
            <input type="password" id="adminPassword" class="form-control" placeholder="••••••••••••"
              value="admin123456" required>
            <button type="button" class="toggle-pwd" id="togglePasswordBtn" aria-label="Toggle password visibility">
              <i class="fa-regular fa-eye"></i>
            </button>
          </div>
        </div>

        <button type="submit" class="submit-btn" id="submitBtn">
          <span>Sign In to Dashboard</span>
          <i class="fa-solid fa-arrow-right"></i>
        </button>
      </form>

      <!-- Quick Credentials Hint for easy demo access -->
      <div class="credentials-hint">
        <strong><i class="fa-solid fa-key" style="margin-right: 6px; color: var(--accent-gold);"></i> Admin Access:</strong>
        Email: <code>admin@mizpahministries.org</code><br>
        Password: <code>admin123456</code>
      </div>

      <a href="index.html" class="back-link">
        <i class="fa-solid fa-arrow-left"></i>
        <span>Return to Main Website</span>
      </a>

    </div>
  </div>

  <!-- Supabase JS Client & API Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-client.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const loginForm = document.getElementById('loginForm');
      const submitBtn = document.getElementById('submitBtn');
      const alertBox = document.getElementById('alertBox');
      const alertMessage = document.getElementById('alertMessage');
      const emailInput = document.getElementById('adminEmail');
      const passwordInput = document.getElementById('adminPassword');
      const togglePasswordBtn = document.getElementById('togglePasswordBtn');

      // Check if already authenticated
      try {
        if (window.ChurchAPI) {
          const session = await window.ChurchAPI.getAdminSession();
          if (session && session.user) {
            window.location.href = 'admin.html';
            return;
          }
        }
      } catch (err) {
        console.warn('Session check note:', err);
      }

      // Password toggle
      togglePasswordBtn.addEventListener('click', () => {
        const isPassword = passwordInput.getAttribute('type') === 'password';
        passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
        togglePasswordBtn.innerHTML = isPassword 
          ? '<i class="fa-regular fa-eye-slash"></i>' 
          : '<i class="fa-regular fa-eye"></i>';
      });

      // Show alert helper
      const showAlert = (message, isError = true) => {
        alertBox.className = `alert-box visible ${isError ? 'alert-error' : 'alert-success'}`;
        const icon = alertBox.querySelector('.alert-icon');
        if (icon) {
          icon.className = isError 
            ? 'fa-solid fa-circle-exclamation alert-icon' 
            : 'fa-solid fa-circle-check alert-icon';
        }
        alertMessage.textContent = message;
      };

      // Handle submit
      loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        alertBox.className = 'alert-box';

        const email = emailInput.value.trim();
        const password = passwordInput.value;

        if (!email || !password) {
          showAlert('Please enter both email and password.');
          return;
        }

        const originalBtnHtml = submitBtn.innerHTML;
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> <span>Verifying credentials...</span>';

        try {
          if (!window.ChurchAPI) {
            throw new Error('Supabase integration library failed to load.');
          }

          const { data, error } = await window.ChurchAPI.signInAdmin(email, password);

          if (error) {
            showAlert(error.message || 'Invalid email or password.');
            submitBtn.disabled = false;
            submitBtn.innerHTML = originalBtnHtml;
            return;
          }

          showAlert('Authentication successful! Opening dashboard...', false);
          setTimeout(() => {
            window.location.href = 'admin.html';
          }, 600);

        } catch (err) {
          showAlert(err.message || 'An unexpected error occurred during sign in.');
          submitBtn.disabled = false;
          submitBtn.innerHTML = originalBtnHtml;
        }
      });
    });
  </script>
</body>

</html>
